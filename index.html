
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Диёры ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121216;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: #1e1e24;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 42, 117, 0.3);
            max-width: 85%;
            width: 330px;
            border: 1px solid rgba(255, 42, 117, 0.3);
            position: relative;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff2a75;
            font-size: 20px;
            margin-bottom: 12px;
        }

        p {
            color: #ddd;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #ff2a75;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 42, 117, 0.4);
        }

        #noBtn {
            background-color: #333;
            color: #aaa;
            position: absolute;
        }

        .heart-bg {
            position: absolute;
            font-size: 22px;
            color: #ff4d6d;
            animation: float 3s infinite ease-in;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="icon">💌</div>
        <h1>Прости меня, Диёра</h1>
        <p>Мы оба были не правы. Не хочу терять тебя, ты у меня самая любимая девушка, ты самое лучшее, что у меня есть. Очень дорожу тобой ❤️</p>
        <p style="font-weight: bold; color: #ff2a75; margin-bottom: 20px;">Ты прощаешь меня?</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="forgive()">Да ❤️</button>
            <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()" style="right: 15px;">Нет 😔</button>
        </div>
    </div>

    <script>
        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function forgive() {
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div style="font-size: 55px; margin-bottom: 10px;">🥰💖✨</div>
                <h1>Ура! Спасибо, любимая!</h1>
                <p>Я очень сильно люблю тебя! Постараюсь больше не обижать и не расстраивать тебя. Ты у меня самая лучшая! ❤️</p>
            `;

            for (let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 70);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-bg';
            heart.innerText = ['❤️', '💖', '🌸', '✨', '💕'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '0px';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4000);
        }
    </script>
</body>
</html>
