<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Диёры ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Нежный романтичный градиент вместо черного фона */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            font-family: 'Arial', sans-serif;
            color: #333;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Контейнер для летающих цветов и узоров на фоне */
        .bg-flowers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .flower {
            position: absolute;
            font-size: 24px;
            opacity: 0.6;
            animation: floatAround 8s infinite linear;
        }

        @keyframes floatAround {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px 22px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            max-width: 85%;
            width: 330px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 10;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff3366;
            font-size: 21px;
            margin-bottom: 12px;
        }

        p {
            color: #444;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #ff3366;
            color: white;
            box-shadow: 0 5px 18px rgba(255, 51, 102, 0.4);
        }

        #noBtn {
            background-color: #e0e0e0;
            color: #555;
            position: absolute;
        }

        .heart-bg {
            position: absolute;
            font-size: 24px;
            animation: floatUp 3s infinite ease-in;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Задний фон с летящими цветами -->
    <div class="bg-flowers" id="bgFlowers"></div>

    <div class="card" id="mainCard">
        <div class="icon">🌸</div>
        <h1>Прости меня, Диёра</h1>
        <p>Мы оба были не правы. Не хочу терять тебя, ты у меня самая любимая девушка, ты самое лучшее, что у меня есть. Очень дорожу тобой ❤️</p>
        <p style="font-weight: bold; color: #ff3366; margin-bottom: 20px;">Ты прощаешь меня?</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="forgive()">Да ❤️</button>
            <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()" style="right: 15px;">Нет 😔</button>
        </div>
    </div>

    <script>
        // Генерация фоновых цветов
        const bgContainer = document.getElementById('bgFlowers');
        const flowers = ['🌸', '🌺', '🌷', '✨', '💖', '🌼'];
        
        for (let i = 0; i < 20; i++) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 5 + 5) + 's';
            flower.style.animationDelay = (Math.random() * 5) + 's';
            bgContainer.appendChild(flower);
        }

        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function forgive() {
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div style="font-size: 55px; margin-bottom: 10px;">🥰💖✨</div>
                <h1>Ура! Спасибо, любимая!</h1>
                <p>Я очень сильно люблю тебя! Постараюсь больше не обижать и не расстраивать тебя. Ты у меня самая лучшая! ❤️</p>
            `;

            for (let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 70);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-bg';
            heart.innerText = ['❤️', '💖', '🌸', '✨', '💕', '🌷'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '0px';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4000);
        }
    </script>
</body>
</html>
